<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Football</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #05070d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .loading-screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(34, 197, 94, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(59, 130, 246, 0.10),
          transparent 35%
        ),
        #05070d;
    }

    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.08);
      filter: blur(70px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo-box {
      width: 110px;
      height: 110px;
      border-radius: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      z-index: 2;

      background: linear-gradient(
        145deg,
        #18b96b,
        #087a48
      );

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(34, 197, 94, 0.20);
    }

    .football {
      width: 62px;
      height: 62px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      color: #111827;

      font-size: 34px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);

      animation: ballPulse 1.8s ease-in-out infinite;
    }

    .brand {
      position: relative;
      z-index: 2;

      margin-top: 24px;

      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .brand span {
      color: #22c55e;
    }

    .tagline {
      position: relative;
      z-index: 2;

      margin-top: 8px;

      color: #8992a5;
      font-size: 13px;
      letter-spacing: 0.4px;
    }

    .loader {
      position: relative;
      z-index: 2;

      width: 42px;
      height: 42px;

      margin-top: 42px;

      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #22c55e;
      border-right-color: #22c55e;

      border-radius: 50%;

      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      position: relative;
      z-index: 2;

      margin-top: 15px;

      color: #697386;
      font-size: 12px;
    }

    .bottom-text {
      position: absolute;
      bottom: 28px;
      left: 0;
      width: 100%;

      text-align: center;

      color: #4f596b;
      font-size: 11px;
      z-index: 2;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ballPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @media (max-width: 360px) {

      .logo-box {
        width: 95px;
        height: 95px;
        border-radius: 26px;
      }

      .football {
        width: 55px;
        height: 55px;
        font-size: 29px;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="loading-screen">

    <div class="glow"></div>

    <div class="logo-box">
      <div class="football">⚽</div>
    </div>

    <div class="brand">
      Live<span>Football</span>
    </div>

    <div class="tagline">
      Live Scores • Fixtures • Results
    </div>

    <div class="loader"></div>

    <div class="loading-text">
      Loading matches...
    </div>

    <div class="bottom-text">
      Your football world, live.
    </div>

  </main>

  <script>
    setTimeout(function () {

      /*

        Bayan mun gama Part 2, wannan zai kai user
        zuwa home.html.
      */

      window.location.href = "home.html";

    }, 2500);
  </script>

</body>
</html>
